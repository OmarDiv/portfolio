<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Omar Mohamed monogram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="omSignatureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#b37feb"/>
    </linearGradient>
  </defs>

  <!-- hex frame, echoes modular/nodal system architecture -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33"
           fill="none" stroke="url(#omSignatureGrad)" stroke-width="3.5"
           stroke-linejoin="round"/>

  <!-- circuit-node ticks at two vertices -->
  <circle cx="60" cy="6" r="4" fill="#00d4ff"/>
  <circle cx="60" cy="114" r="4" fill="#b37feb"/>

  <!-- OM monogram, sharing a single connecting stroke like two linked modules -->
  <text x="60" y="70" text-anchor="middle"
        font-family="'Fira Code', 'JetBrains Mono', monospace"
        font-size="40" font-weight="700" letter-spacing="-3"
        fill="url(#omSignatureGrad)">OM</text>
</svg>
